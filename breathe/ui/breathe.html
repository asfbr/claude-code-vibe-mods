<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#04050b">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #04050b;
    color: #e6e9f2;
    font-family: "Sitka Display", "Sitka Text", Cambria, Georgia, serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  body.shown { opacity: 1; }
  body.leaving { opacity: 0; transition-duration: 1.4s; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .words {
    position: fixed; left: 0; right: 0; bottom: 18px;
    display: grid; justify-items: center; gap: 6px;
  }
  .label { font-size: 21px; font-style: italic; font-weight: 400; transition: opacity 0.5s ease; min-height: 1.25em; }
  .label.fade { opacity: 0; }
  .count { font-size: 13px; font-variant-numeric: tabular-nums; opacity: 0.4; min-height: 1.2em; }
  .dots { display: flex; gap: 6px; margin-top: 2px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: rgb(255 255 255 / 0.14); transition: background 0.8s ease; }
  .dots i.done { background: rgb(255 255 255 / 0.55); }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="words">
  <div class="label" id="label">settle in</div>
  <div class="count" id="count"></div>
  <div class="dots" id="dots"></div>
</div>
<script>
// ?p=4-6|box|4-7-8 (pattern), s=seconds, v=sound volume 0-1. Closes itself after the last cycle; Esc closes now.
const q = new URLSearchParams(location.search)
const PATTERNS = {
  '4-6': [['in', 4], ['out', 6]],
  'box': [['in', 4], ['hold', 4], ['out', 4], ['hold', 4]],
  '4-7-8': [['in', 4], ['hold', 7], ['out', 8]],
}
const phases = PATTERNS[q.get('p')] ?? PATTERNS['4-6']
const cycleSec = phases.reduce((s, [, d]) => s + d, 0)
const cycles = Math.max(1, Math.round((Number(q.get('s')) || 30) / cycleSec))
const volume = Math.min(1, Math.max(0, Number(q.get('v') ?? 0.35)))
const INTRO = 1.6 // seconds of "settle in" before the first breath

const $ = s => document.querySelector(s)
const label = $('#label'), count = $('#count'), dots = $('#dots')
const canvas = $('#sky'), pen = canvas.getContext('2d')
for (let i = 0; i < cycles; i++) dots.append(document.createElement('i'))

// Each phase its own light, core to edge, blended as one phase turns into the next.
const HUES = {
  in: [[168, 228, 255], [84, 112, 255]],
  full: [[218, 182, 255], [116, 84, 236]],
  out: [[255, 204, 140], [232, 96, 124]],
  empty: [[150, 160, 246], [64, 74, 176]],
}
const BLEND = 1.6 // seconds a phase takes to reach its colours
const ease = t => (1 - Math.cos(Math.PI * t)) / 2
const lerp = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t)
const rgb = (c, a) => `rgb(${Math.round(c[0])} ${Math.round(c[1])} ${Math.round(c[2])} / ${a})`
const WORDS = { in: 'breathe in', hold: 'hold', out: 'breathe out' }

// Sound: an organ-like drone through a long synthetic reverb. The chord moves with each phase,
// the filter opens as the lungs fill, and filtered noise breathes while the form moves.
let sound
const CHORDS = { in: [110, 164.81, 261.63], full: [87.31, 130.81, 220], out: [98, 146.83, 246.94], empty: [87.31, 130.81, 220] }
const startSound = () => {
  if (volume === 0) return
  const ctx = new AudioContext()
  const master = ctx.createGain(); master.gain.value = 0
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 300; tone.Q.value = 0.8
  const len = ctx.sampleRate * 6, ir = ctx.createBuffer(2, len, ctx.sampleRate)
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2.6
  }
  const verb = ctx.createConvolver(); verb.buffer = ir
  const wet = ctx.createGain(); wet.gain.value = 0.7
  const dry = ctx.createGain(); dry.gain.value = 0.45
  tone.connect(dry).connect(master)
  tone.connect(verb).connect(wet).connect(master)
  master.connect(ctx.destination)
  const organ = ctx.createPeriodicWave(new Float32Array([0, 1, 0.5, 0.32, 0.2, 0.1, 0.12, 0, 0.06]), new Float32Array(9))
  const voice = (freq, level) => {
    const g = ctx.createGain(); g.gain.value = level; g.connect(tone)
    const oscs = [-5, 5].map(cents => {
      const o = ctx.createOscillator(); o.setPeriodicWave(organ)
      o.frequency.value = freq; o.detune.value = cents; o.connect(g); o.start()
      return o
    })
    return { glide: (f, at) => oscs.forEach(o => o.frequency.setTargetAtTime(f, at, 0.7)) }
  }
  voice(55, 0.55) // the pedal: A1, all the way through
  const chord = CHORDS.empty.map((f, i) => voice(f, [0.4, 0.3, 0.18][i]))
  const noise = ctx.createBufferSource(), nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate)
  nb.getChannelData(0).forEach((_, i, d) => { d[i] = Math.random() * 2 - 1 })
  noise.buffer = nb; noise.loop = true
  const air = ctx.createBiquadFilter(); air.type = 'bandpass'; air.Q.value = 0.9; air.frequency.value = 700
  const airGain = ctx.createGain(); airGain.gain.value = 0
  noise.connect(air).connect(airGain).connect(verb)
  airGain.connect(master); noise.start()
  master.gain.setTargetAtTime(0.32 * volume, ctx.currentTime, 0.9)
  sound = {
    ctx,
    phase: key => chord.forEach((v, i) => v.glide(CHORDS[key][i], ctx.currentTime)),
    breathe: (b, motion, inhaling) => {
      const t = ctx.currentTime
      tone.frequency.setTargetAtTime(260 + 1500 * b, t, 0.12)
      airGain.gain.setTargetAtTime(0.05 * motion, t, 0.15)
      air.frequency.setTargetAtTime(inhaling ? 900 + 500 * b : 500 + 400 * b, t, 0.3)
    },
    stop: () => master.gain.setTargetAtTime(0, ctx.currentTime, 0.35),
  }
}
addEventListener('pointerdown', () => sound?.ctx.resume()) // opened in a plain browser, audio waits for a click

// The picture: a nebula of uneven contour lines around a soft core, and dust that the breath gathers and lets go.
const RINGS = 15, STEPS = 140, MOTES = 150, TIMER_RING = 7
const seed = (n => () => (n = (n * 16807) % 2147483647) / 2147483647)(9301)
const rings = Array.from({ length: RINGS }, (_, j) => ({
  waves: [1, 2, 3, 5, 7].map((k, i) => ({ k, amp: [0.55, 0.5, 0.35, 0.22, 0.12][i] * (0.6 + 0.8 * seed()),
    phase: seed() * Math.PI * 2, speed: (seed() - 0.5) * (0.5 + 0.25 * k) })),
  tilt: seed() * Math.PI * 2,
}))
const motes = Array.from({ length: MOTES }, () => ({
  angle: seed() * Math.PI * 2, reach: 1.15 + seed() ** 1.6 * 1.6, size: 0.4 + seed() * 1.1,
  twinkle: 0.6 + seed() * 2.2, phase: seed() * Math.PI * 2,
}))
let size = { w: 0, h: 0, dpr: 1 }, grain
const fit = () => {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight
  if (w === size.w && h === size.h && dpr === size.dpr) return
  size = { w, h, dpr }
  canvas.width = w * dpr; canvas.height = h * dpr
  grain = document.createElement('canvas'); grain.width = canvas.width; grain.height = canvas.height
  const g = grain.getContext('2d'), img = g.createImageData(grain.width, grain.height)
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 10 + Math.random() * 16
    img.data[i] = v * 0.8; img.data[i + 1] = v * 0.85; img.data[i + 2] = v * 1.3; img.data[i + 3] = 255
  }
  g.putImageData(img, 0, 0)
  const vignette = g.createRadialGradient(grain.width / 2, grain.height * 0.42, 0, grain.width / 2, grain.height * 0.42, grain.width * 0.9)
  vignette.addColorStop(0, 'rgb(4 5 11 / 0.2)'); vignette.addColorStop(1, 'rgb(2 2 6 / 0.85)')
  g.fillStyle = vignette; g.fillRect(0, 0, grain.width, grain.height)
}

const contour = (cx, cy, r, ring, amp, time, upTo = 1) => {
  pen.beginPath()
  for (let i = 0; i <= Math.round(STEPS * upTo); i++) {
    const a = (i / STEPS) * Math.PI * 2 - Math.PI / 2
    let w = 0
    for (const v of ring.waves) w += v.amp * Math.sin(v.k * (a + ring.tilt) + v.phase + time * v.speed)
    const rr = r * (1 + amp * w)
    pen.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a))
  }
}

const paint = (b, [core, edge], motion, time, progress) => {
  fit()
  const { dpr } = size, W = canvas.width, H = canvas.height
  const cx = W / 2, cy = H * 0.42, S = Math.min(W, H * 0.84) / 2
  const R = S * (0.3 + 0.36 * b) // the core's radius; the outermost line reaches about 1.4 R
  pen.globalCompositeOperation = 'source-over'
  pen.drawImage(grain, 0, 0)
  pen.globalCompositeOperation = 'lighter'

  const glow = pen.createRadialGradient(cx, cy, 0, cx, cy, R * 2.2)
  glow.addColorStop(0, rgb(core, 0.32)); glow.addColorStop(0.35, rgb(edge, 0.14)); glow.addColorStop(1, rgb(edge, 0))
  pen.fillStyle = glow; pen.fillRect(0, 0, W, H)

  const body = pen.createRadialGradient(cx - R * 0.15, cy - R * 0.2, R * 0.05, cx, cy, R * 1.05)
  body.addColorStop(0, rgb(lerp(core, [255, 255, 255], 0.35), 0.5)); body.addColorStop(0.6, rgb(core, 0.2)); body.addColorStop(1, rgb(edge, 0.04))
  pen.fillStyle = body
  contour(cx, cy, R, rings[0], 0.05 + 0.05 * motion, time * 0.6); pen.closePath(); pen.fill()

  // Each line drifts off-centre on its own slow orbit, so the set never settles into neat circles.
  const line = j => {
    const f = j / (RINGS - 1), off = R * (0.03 + 0.06 * f), spin = time * 0.21 * (1 + (j % 3) * 0.4) + j * 1.7
    return [cx + off * Math.cos(spin), cy + off * Math.sin(spin * 1.3), R * (0.55 + 0.85 * f), rings[j],
      (0.045 + 0.1 * f ** 1.2) * (0.7 + 0.9 * motion), f]
  }
  pen.lineCap = 'round'
  for (let j = 0; j < RINGS; j++) {
    const [x, y, r, ring, amp, f] = line(j)
    pen.lineWidth = (j === TIMER_RING ? 1 : 0.6 + 0.6 * (1 - f)) * dpr
    pen.strokeStyle = rgb(lerp(core, edge, f), 0.06 + 0.42 * (1 - f) ** 1.5)
    contour(x, y, r, ring, amp, time); pen.stroke()
  }
  if (progress > 0) { // the phase's timer, traced along one line
    const [x, y, r, ring, amp] = line(TIMER_RING)
    pen.lineWidth = 2 * dpr; pen.strokeStyle = rgb(lerp(core, [255, 255, 255], 0.25), 0.85)
    contour(x, y, r, ring, amp, time, progress); pen.stroke()
  }

  for (const m of motes) { // gathered close when the lungs are full, scattered when empty
    m.angle += (0.0007 + 0.004 * motion) / m.reach
    const d = S * (0.62 + (m.reach - 0.55) * (1.15 - 0.55 * b))
    const x = cx + d * Math.cos(m.angle), y = cy + d * Math.sin(m.angle) * 0.92
    const alpha = (0.18 + 0.32 * (0.5 + 0.5 * Math.sin(time * m.twinkle + m.phase))) * (0.5 + 0.5 * b)
    pen.fillStyle = rgb(lerp(core, [255, 255, 255], 0.5), alpha)
    pen.beginPath(); pen.arc(x, y, m.size * dpr, 0, Math.PI * 2); pen.fill()
  }
}

const setLabel = text => {
  if (label.textContent === text) return
  label.classList.add('fade')
  setTimeout(() => { label.textContent = text; label.classList.remove('fade') }, 260)
}

let leaving = false
const leave = () => {
  if (leaving) return
  leaving = true
  sound?.stop()
  document.body.classList.add('leaving')
  setTimeout(() => window.close(), 1500)
}

let start, lastKey, lastB = 0, lastT = 0, from = HUES.empty, to = HUES.empty, since = 0, done = false
const frame = now => {
  start ??= now
  const time = (now - start) / 1000, t = time - INTRO
  const blend = ease(Math.min(1, (time - since) / BLEND))
  const colors = [lerp(from[0], to[0], blend), lerp(from[1], to[1], blend)]
  if (t < 0) { paint(0, colors, 0, time, 0); requestAnimationFrame(frame); return }
  const cycle = Math.floor(t / cycleSec)
  if (cycle >= cycles) { // the form rests at empty while the words say goodbye
    paint(0, colors, 0, time, 0)
    if (!done) {
      done = true
      for (const d of dots.children) d.classList.add('done')
      count.textContent = ''; setLabel('well done'); setTimeout(leave, 1800)
    }
    requestAnimationFrame(frame)
    return
  }
  let into = t - cycle * cycleSec, i = 0
  while (into >= phases[i][1]) into -= phases[i++][1]
  const [kind, dur] = phases[i], p = into / dur
  const before = phases[(i + phases.length - 1) % phases.length][0]
  const hue = kind === 'hold' ? (before === 'in' ? 'full' : 'empty') : kind
  const b = kind === 'in' ? ease(p) : kind === 'out' ? 1 - ease(p) : hue === 'full' ? 1 : 0
  const motion = Math.min(1, Math.abs(b - lastB) / Math.max(1e-3, time - lastT) / 0.4)
  lastB = b; lastT = time
  const key = `${cycle}:${i}`
  if (key !== lastKey) {
    lastKey = key
    from = colors; to = HUES[hue]; since = time
    setLabel(WORDS[kind])
    sound?.phase(hue)
    for (let d = 0; d < cycle; d++) dots.children[d].classList.add('done')
  }
  paint(b, colors, motion, time, p)
  sound?.breathe(b, motion, kind === 'in')
  count.textContent = Math.ceil(dur - into)
  requestAnimationFrame(frame)
}

addEventListener('keydown', e => { if (e.key === 'Escape') leave() })
startSound()
requestAnimationFrame(() => { document.body.classList.add('shown'); requestAnimationFrame(frame) })
</script>
</body>
</html>
